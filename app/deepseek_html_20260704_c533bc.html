<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Paper Resizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  :root{
    --bg-void:#0F1B2D;
    --bg-panel:#152439;
    --bg-panel-2:#1B2C45;
    --line-blueprint:#2C4467;
    --paper:#F7F5EF;
    --paper-shadow:rgba(0,0,0,.45);
    --ink:#EDEAE0;
    --ink-dim:#8FA3C0;
    --muted:#5D7290;
    --cyan:#6FA8DC;
    --amber:#E8A33D;
    --regmark:#E85D4A;
    --ok:#7FB88A;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg-void);color:var(--ink);font-family:'Inter',sans-serif;}
  ::selection{background:var(--amber);color:#0F1B2D;}
  .mono{font-family:'Space Mono',monospace;}

  /* ---------- HEADER ---------- */
  header{
    height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;border-bottom:1px solid var(--line-blueprint);
    background:linear-gradient(180deg,#152439,#0F1B2D);
  }
  header .brand{display:flex;align-items:baseline;gap:10px;}
  header .brand .mark{font-family:'Space Mono',monospace;font-weight:700;letter-spacing:.5px;font-size:15px;color:var(--ink);}
  header .brand .mark span{color:var(--cyan);}
  header .brand .tag{font-size:11px;color:var(--muted);font-family:'Space Mono',monospace;}
  header .status{font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-dim);}

  /* ---------- LAYOUT ---------- */
  .app{display:flex;flex-direction:column;height:100vh;}
  .body{flex:1;display:flex;min-height:0;}

  /* ---------- SIDEBAR ---------- */
  aside{
    width:308px;flex-shrink:0;overflow-y:auto;border-right:1px solid var(--line-blueprint);
    background:var(--bg-panel);
  }
  aside::-webkit-scrollbar{width:8px;}
  aside::-webkit-scrollbar-thumb{background:var(--line-blueprint);border-radius:4px;}

  .section{border-bottom:1px solid var(--line-blueprint);padding:16px 18px;}
  .section-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .section-head .idx{
    font-family:'Space Mono',monospace;font-size:10px;color:var(--bg-void);
    background:var(--cyan);width:20px;height:20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;
  }
  .section-head h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);font-weight:600;}

  label.field-label{display:block;font-size:11px;color:var(--ink-dim);margin-bottom:5px;font-family:'Space Mono',monospace;}

  /* upload */
  .dropzone{
    border:1.5px dashed var(--line-blueprint);border-radius:var(--radius);padding:22px 12px;text-align:center;
    cursor:pointer;transition:.15s;background:var(--bg-panel-2);
  }
  .dropzone:hover,.dropzone.drag{border-color:var(--cyan);background:#1E3350;}
  .dropzone p{margin:0;font-size:12px;color:var(--ink-dim);}
  .dropzone p.main{color:var(--ink);font-size:13px;margin-bottom:4px;}
  .filelist{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
  .fileitem{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--bg-panel-2);border:1px solid var(--line-blueprint);border-radius:var(--radius);
    padding:7px 9px;cursor:pointer;font-size:12px;
  }
  .fileitem.active{border-color:var(--cyan);background:#1E3350;}
  .fileitem .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px;}
  .fileitem .fmeta{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);}
  .fileitem .rm{color:var(--regmark);background:none;border:none;cursor:pointer;font-size:14px;padding:0 2px;}

  /* generic controls */
  select, input[type=number], input[type=text]{
    width:100%;background:var(--bg-panel-2);border:1px solid var(--line-blueprint);color:var(--ink);
    padding:7px 8px;border-radius:var(--radius);font-family:'Space Mono',monospace;font-size:12px;outline:none;
  }
  select:focus,input:focus{border-color:var(--cyan);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .stack{display:flex;flex-direction:column;gap:10px;}

  .radiogroup{display:flex;flex-direction:column;gap:6px;}
  .radiopill{
    display:flex;align-items:center;gap:9px;background:var(--bg-panel-2);border:1px solid var(--line-blueprint);
    border-radius:var(--radius);padding:8px 10px;cursor:pointer;font-size:12.5px;
  }
  .radiopill.checked{border-color:var(--amber);background:#25324a;}
  .radiopill input{accent-color:var(--amber);}
  .radiopill .hint{font-size:10.5px;color:var(--muted);margin-left:auto;font-family:'Space Mono',monospace;}

  /* alignment grid */
  .align-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:120px;margin:0 auto;}
  .align-btn{
    width:36px;height:36px;border:1px solid var(--line-blueprint);background:var(--bg-panel-2);
    border-radius:var(--radius);cursor:pointer;position:relative;
  }
  .align-btn::after{content:'';position:absolute;width:6px;height:6px;background:var(--muted);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);}
  .align-btn:hover{border-color:var(--cyan);}
  .align-btn.sel{border-color:var(--regmark);background:#2c2030;}
  .align-btn.sel::after{background:var(--regmark);width:9px;height:9px;}

  /* margin */
  .margin-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .lockrow{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:11.5px;color:var(--ink-dim);}
  .lockrow button{
    background:var(--bg-panel-2);border:1px solid var(--line-blueprint);color:var(--ink-dim);
    font-family:'Space Mono',monospace;font-size:10.5px;padding:5px 9px;border-radius:var(--radius);cursor:pointer;
  }
  .lockrow button.on{color:var(--amber);border-color:var(--amber);}

  /* export */
  .btn-primary{
    width:100%;background:var(--amber);color:#211405;border:none;padding:12px;border-radius:var(--radius);
    font-weight:700;font-size:13px;cursor:pointer;letter-spacing:.02em;font-family:'Inter',sans-serif;
  }
  .btn-primary:hover{background:#f3b158;}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-secondary{
    width:100%;background:transparent;color:var(--ink-dim);border:1px solid var(--line-blueprint);
    padding:9px;border-radius:var(--radius);font-size:12px;cursor:pointer;margin-top:8px;font-family:'Inter',sans-serif;
  }
  .btn-secondary:hover{border-color:var(--cyan);color:var(--ink);}

  /* ---------- MAIN / PREVIEW ---------- */
  main{
    flex:1;position:relative;overflow:auto;display:flex;align-items:center;justify-content:center;
    background-image:radial-gradient(var(--line-blueprint) 1px, transparent 1px);
    background-size:22px 22px;
  }
  .empty-state{text-align:center;color:var(--muted);font-family:'Space Mono',monospace;}
  .empty-state .big{font-size:40px;color:var(--line-blueprint);margin-bottom:10px;}

  .preview-wrap{position:relative;filter:drop-shadow(0 18px 40px var(--paper-shadow));}
  canvas#previewCanvas{display:block;background:var(--paper);border-radius:2px;}

  .toolbar{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    display:flex;gap:4px;background:var(--bg-panel);border:1px solid var(--line-blueprint);
    border-radius:6px;padding:6px;box-shadow:0 8px 20px rgba(0,0,0,.4);
  }
  .toolbar button{
    background:transparent;border:none;color:var(--ink-dim);width:30px;height:30px;border-radius:4px;cursor:pointer;font-size:14px;
  }
  .toolbar button:hover{background:var(--bg-panel-2);color:var(--ink);}
  .toolbar .pagejump{font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-dim);display:flex;align-items:center;padding:0 8px;white-space:nowrap;}

  /* ---------- STATUS BAR ---------- */
  footer{
    height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;border-top:1px solid var(--line-blueprint);background:var(--bg-panel);
    font-family:'Space Mono',monospace;font-size:10.5px;color:var(--muted);
  }
  footer .ok{color:var(--ok);}

  @media (max-width:860px){
    aside{position:fixed;left:0;top:52px;bottom:30px;z-index:5;transform:translateX(-100%);transition:.2s;}
    aside.open{transform:translateX(0);}
    .menu-toggle{display:inline-flex!important;}
  }
  .menu-toggle{display:none;background:none;border:1px solid var(--line-blueprint);color:var(--ink);border-radius:4px;padding:6px 9px;cursor:pointer;}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <span class="mark">PAPER<span>://</span>RESIZE</span>
      <span class="tag">local · offline · no upload</span>
    </div>
    <div class="status" id="headerStatus">no document loaded</div>
  </header>

  <div class="body">
    <aside id="sidebar">

      <!-- 01 UPLOAD -->
      <div class="section">
        <div class="section-head"><span class="idx">01</span><h3>Source Files</h3></div>
        <div class="dropzone" id="dropzone">
          <p class="main">Drop PDF here</p>
          <p>or click to browse · max 100MB</p>
          <input type="file" id="fileInput" accept="application/pdf" multiple style="display:none">
        </div>
        <div class="filelist" id="filelist"></div>
      </div>

      <!-- 02 PAPER SIZE -->
      <div class="section">
        <div class="section-head"><span class="idx">02</span><h3>Paper Size</h3></div>
        <div class="stack">
          <div>
            <label class="field-label">PRESET</label>
            <select id="paperPreset">
              <option value="A5">A5</option>
              <option value="A4" selected>A4</option>
              <option value="F4">F4 (Folio)</option>
              <option value="Letter">Letter</option>
              <option value="Legal">Legal</option>
              <option value="A3">A3</option>
              <option value="Tabloid">Tabloid</option>
              <option value="Executive">Executive</option>
              <option value="Custom">Custom…</option>
            </select>
          </div>
          <div class="row3" id="customSizeRow" style="display:none;">
            <div>
              <label class="field-label">WIDTH</label>
              <input type="number" id="customW" step="0.1" value="210">
            </div>
            <div>
              <label class="field-label">HEIGHT</label>
              <input type="number" id="customH" step="0.1" value="297">
            </div>
            <div>
              <label class="field-label">UNIT</label>
              <select id="unitSelect">
                <option value="mm" selected>mm</option>
                <option value="cm">cm</option>
                <option value="in">inch</option>
              </select>
            </div>
          </div>
          <div id="unitOnlyRow">
            <label class="field-label">MARGIN / SIZE UNIT</label>
            <select id="unitSelect2">
              <option value="mm" selected>mm</option>
              <option value="cm">cm</option>
              <option value="in">inch</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 03 ORIENTATION -->
      <div class="section">
        <div class="section-head"><span class="idx">03</span><h3>Orientation</h3></div>
        <div class="radiogroup" id="orientationGroup">
          <label class="radiopill checked"><input type="radio" name="orient" value="auto" checked> Auto <span class="hint">match source</span></label>
          <label class="radiopill"><input type="radio" name="orient" value="portrait"> Portrait</label>
          <label class="radiopill"><input type="radio" name="orient" value="landscape"> Landscape</label>
        </div>
      </div>

      <!-- 04 RESIZE MODE -->
      <div class="section">
        <div class="section-head"><span class="idx">04</span><h3>Resize Mode</h3></div>
        <div class="radiogroup" id="modeGroup">
          <label class="radiopill checked"><input type="radio" name="mode" value="fit" checked> Scale Down <span class="hint">no crop</span></label>
          <label class="radiopill"><input type="radio" name="mode" value="crop"> Crop <span class="hint">keeps scale</span></label>
        </div>
      </div>

      <!-- 05 ALIGNMENT -->
      <div class="section">
        <div class="section-head"><span class="idx">05</span><h3>Alignment</h3></div>
        <div class="align-grid" id="alignGrid">
          <button class="align-btn" data-a="TL"></button>
          <button class="align-btn" data-a="TC"></button>
          <button class="align-btn" data-a="TR"></button>
          <button class="align-btn" data-a="CL"></button>
          <button class="align-btn sel" data-a="CC"></button>
          <button class="align-btn" data-a="CR"></button>
          <button class="align-btn" data-a="BL"></button>
          <button class="align-btn" data-a="BC"></button>
          <button class="align-btn" data-a="BR"></button>
        </div>
      </div>

      <!-- 06 MARGIN -->
      <div class="section">
        <div class="section-head"><span class="idx">06</span><h3>Margin</h3></div>
        <div class="margin-grid">
          <div><label class="field-label">TOP</label><input type="number" step="0.1" id="mTop" value="0"></div>
          <div><label class="field-label">BOTTOM</label><input type="number" step="0.1" id="mBottom" value="0"></div>
          <div><label class="field-label">LEFT</label><input type="number" step="0.1" id="mLeft" value="0"></div>
          <div><label class="field-label">RIGHT</label><input type="number" step="0.1" id="mRight" value="0"></div>
        </div>
        <div class="lockrow">
          <span>Lock all margins</span>
          <button id="lockBtn">OFF</button>
        </div>
        <button class="btn-secondary" id="resetMarginBtn">Reset Margin</button>
      </div>

      <!-- 07 EXPORT -->
      <div class="section">
        <div class="section-head"><span class="idx">07</span><h3>Export</h3></div>
        <button class="btn-primary" id="exportBtn" disabled>Generate &amp; Download</button>
        <div id="exportProgress" style="margin-top:8px;font-size:11px;color:var(--ink-dim);font-family:'Space Mono',monospace;"></div>
      </div>

    </aside>

    <main id="mainArea">
      <div class="empty-state" id="emptyState">
        <div class="big">▢</div>
        <p>Upload a PDF to begin</p>
      </div>
      <div class="preview-wrap" id="previewWrap" style="display:none;">
        <canvas id="previewCanvas"></canvas>
      </div>
    </main>
  </div>

  <footer>
    <span id="footLeft">ready</span>
    <span id="footRight" class="mono"></span>
  </footer>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const { PDFDocument } = PDFLib;

/* ---------------- constants ---------------- */
const MM2PT = 72/25.4;
const PRESETS_MM = {
  A5:[148,210], A4:[210,297], F4:[210,330], Letter:[215.9,279.4],
  Legal:[215.9,355.6], A3:[297,420], Tabloid:[279.4,431.8], Executive:[184.15,266.7]
};
const UNIT2MM = { mm:1, cm:10, in:25.4 };

/* ---------------- state ---------------- */
const state = {
  files: [],           // {name, size, bytes(ArrayBuffer), pdfjsDoc, numPages, pageIndex}
  activeFile: -1,
  unit: 'mm',
  paperPreset: 'A4',
  customW_mm: 210,
  customH_mm: 297,
  orientation: 'auto',
  mode: 'fit',
  align: 'CC',
  margin_mm: { top:0, bottom:0, left:0, right:0 },
  marginLocked: false,
  zoom: 1
};

/* ---------------- helpers ---------------- */
function mmToPt(mm){ return mm*MM2PT; }
function unitToMM(v,u){ return v*UNIT2MM[u]; }
function mmToUnit(mm,u){ return mm/UNIT2MM[u]; }
function fmt(n){ return Math.round(n*100)/100; }

function alignFactors(a){
  const row = a[0], col = a[1];
  const colFactor = col==='L'?0:col==='R'?1:0.5;
  const rowFactorTop = row==='T'?0:row==='B'?1:0.5; // 0 = top
  return { colFactor, rowFactorTop };
}

function getPaperSizeMM(){
  if(state.paperPreset==='Custom') return [state.customW_mm, state.customH_mm];
  return PRESETS_MM[state.paperPreset];
}

// returns {pW,pH} in pt, already orientation-resolved, given source orientation flag origIsLandscape
function resolvePaperPt(origIsLandscape){
  let [wMM,hMM] = getPaperSizeMM();
  let w = Math.min(wMM,hMM), h = Math.max(wMM,hMM); // normalize portrait base
  let landscape;
  if(state.orientation==='auto') landscape = origIsLandscape;
  else landscape = state.orientation==='landscape';
  if(landscape){ [w,h] = [h,w]; }
  return { pW: mmToPt(w), pH: mmToPt(h) };
}

// core layout math shared between preview + export
// origW,origH in pt. returns geometry in pt: {pW,pH,availW,availH,marginPt, contentW,contentH,destX,destY, cropSW,cropSH,cropSX,cropSY, needsCrop}
function computeLayout(origW, origH){
  const origLandscape = origW > origH;
  const { pW, pH } = resolvePaperPt(origLandscape);
  const mTop = mmToPt(state.margin_mm.top), mBottom = mmToPt(state.margin_mm.bottom);
  const mLeft = mmToPt(state.margin_mm.left), mRight = mmToPt(state.margin_mm.right);
  const availW = Math.max(pW - mLeft - mRight, 1);
  const availH = Math.max(pH - mTop - mBottom, 1);
  const { colFactor, rowFactorTop } = alignFactors(state.align);

  let contentW, contentH, cropSW, cropSH, cropSX, cropSY;
  if(state.mode==='fit'){
    const scale = Math.min(availW/origW, availH/origH);
    contentW = origW*scale; contentH = origH*scale;
    cropSW = origW; cropSH = origH; cropSX = 0; cropSY = 0;
  } else {
    contentW = Math.min(origW, availW);
    contentH = Math.min(origH, availH);
    const excSW = origW - contentW, excSH = origH - contentH;
    cropSX = excSW*colFactor;
    cropSY = excSH*(1-rowFactorTop); // from bottom
    cropSW = contentW; cropSH = contentH;
  }
  const excDW = availW - contentW, excDH = availH - contentH;
  const destX = mLeft + excDW*colFactor;
  const destY = mBottom + excDH*(1-rowFactorTop); // from bottom

  return { pW,pH,availW,availH, mTop,mBottom,mLeft,mRight,
    contentW,contentH,destX,destY, cropSW,cropSH,cropSX,cropSY };
}

/* ---------------- UI: files ---------------- */
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
dropzone.addEventListener('click', ()=>fileInput.click());
['dragover','dragenter'].forEach(ev=>dropzone.addEventListener(ev,e=>{e.preventDefault();dropzone.classList.add('drag');}));
['dragleave','drop'].forEach(ev=>dropzone.addEventListener(ev,e=>{e.preventDefault();dropzone.classList.remove('drag');}));
dropzone.addEventListener('drop', e=>handleFiles(e.dataTransfer.files));
fileInput.addEventListener('change', e=>handleFiles(e.target.files));

async function handleFiles(fileListRaw){
  const files = Array.from(fileListRaw).filter(f=>f.type==='application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
  for(const f of files){
    if(f.size > 100*1024*1024){ alert(`${f.name} melebihi 100MB, dilewati.`); continue; }
    const buf = await f.arrayBuffer();
    let doc;
    try{
      doc = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
    }catch(err){ alert(`Gagal membaca ${f.name}: file PDF tidak valid.`); continue; }
    state.files.push({ name:f.name, size:f.size, bytes:buf, pdfjsDoc:doc, numPages:doc.numPages, pageIndex:0 });
  }
  if(state.activeFile===-1 && state.files.length>0) state.activeFile = 0;
  renderFileList();
  renderPreview();
  updateExportEnabled();
}

function renderFileList(){
  const list = document.getElementById('filelist');
  list.innerHTML = '';
  state.files.forEach((f,i)=>{
    const div = document.createElement('div');
    div.className = 'fileitem'+(i===state.activeFile?' active':'');
    div.innerHTML = `<div><div class="fname">${f.name}</div><div class="fmeta">${(f.size/1024/1024).toFixed(2)}MB · ${f.numPages}p</div></div><button class="rm" data-i="${i}">✕</button>`;
    div.addEventListener('click',(e)=>{
      if(e.target.classList.contains('rm')) return;
      state.activeFile = i; renderFileList(); renderPreview();
    });
    div.querySelector('.rm').addEventListener('click', (e)=>{
      e.stopPropagation();
      const idx = parseInt(e.target.dataset.i);
      state.files.splice(idx,1);
      if(state.activeFile>=state.files.length) state.activeFile = state.files.length-1;
      renderFileList(); renderPreview(); updateExportEnabled();
    });
    list.appendChild(div);
  });
  document.getElementById('headerStatus').textContent = state.files.length
    ? `${state.files.length} file(s) loaded` : 'no document loaded';
}

function updateExportEnabled(){
  document.getElementById('exportBtn').disabled = state.files.length===0;
}

/* ---------------- UI: controls binding ---------------- */
const paperPresetEl = document.getElementById('paperPreset');
const customSizeRow = document.getElementById('customSizeRow');
const unitOnlyRow = document.getElementById('unitOnlyRow');
paperPresetEl.addEventListener('change', ()=>{
  state.paperPreset = paperPresetEl.value;
  customSizeRow.style.display = state.paperPreset==='Custom' ? 'grid':'none';
  unitOnlyRow.style.display = state.paperPreset==='Custom' ? 'none':'block';
  renderPreview();
});

function syncUnitSelects(u){
  document.getElementById('unitSelect').value = u;
  document.getElementById('unitSelect2').value = u;
}
[document.getElementById('unitSelect'), document.getElementById('unitSelect2')].forEach(sel=>{
  sel.addEventListener('change', ()=>{
    const newUnit = sel.value;
    // convert displayed margin values
    state.unit = newUnit;
    syncUnitSelects(newUnit);
    refreshMarginInputsFromState();
    refreshCustomSizeInputsFromState();
    renderPreview();
  });
});

const customWEl = document.getElementById('customW');
const customHEl = document.getElementById('customH');
customWEl.addEventListener('input', ()=>{ state.customW_mm = unitToMM(parseFloat(customWEl.value)||0, state.unit); renderPreview(); });
customHEl.addEventListener('input', ()=>{ state.customH_mm = unitToMM(parseFloat(customHEl.value)||0, state.unit); renderPreview(); });

function refreshCustomSizeInputsFromState(){
  customWEl.value = fmt(mmToUnit(state.customW_mm, state.unit));

const mTopEl = document.getElementById('mTop'), mBottomEl = document.getElementById('mBottom');
const mLeftEl = document.getElementById('mLeft'), mRightEl = document.getElementById('mRight');
function marginInputHandler(key, el){
  return ()=>{
    const val = parseFloat(el.value)||0;
    const mm = unitToMM(val, state.unit);
    if(state.marginLocked){
      state.margin_mm.top = state.margin_mm.bottom = state.margin_mm.left = state.margin_mm.right = mm;
      refreshMarginInputsFromState();
    } else {
      state.margin_mm[key] = mm;
    }
    renderPreview();
  };
}
mTopEl.addEventListener('input', marginInputHandler('top', mTopEl));
mBottomEl.addEventListener('input', marginInputHandler('bottom', mBottomEl));
mLeftEl.addEventListener('input', marginInputHandler('left', mLeftEl));
mRightEl.addEventListener('input', marginInputHandler('right', mRightEl));

function refreshMarginInputsFromState(){
  mTopEl.value = fmt(mmToUnit(state.margin_mm.top, state.unit));
  mBottomEl.value = fmt(mmToUnit(state.margin_mm.bottom, state.unit));
  mLeftEl.value = fmt(mmToUnit(state.margin_mm.left, state.unit));
  mRightEl.value = fmt(mmToUnit(state.margin_mm.right, state.unit));
}

const lockBtn = document.getElementById('lockBtn');
lockBtn.addEventListener('click', ()=>{
  state.marginLocked = !state.marginLocked;
  lockBtn.textContent = state.marginLocked ? 'ON' : 'OFF';
  lockBtn.classList.toggle('on', state.marginLocked);
});
document.getElementById('resetMarginBtn').addEventListener('click', ()=>{
  state.margin_mm = { top:0,bottom:0,left:0,right:0 };
  refreshMarginInputsFromState();
  renderPreview();
});

/* ---------------- preview rendering ---------------- */
let renderToken = 0;
async function renderPreview(){
  const myToken = ++renderToken;
  const emptyState = document.getElementById('emptyState');
  const previewWrap = document.getElementById('previewWrap');
  if(state.activeFile===-1 || !state.files[state.activeFile]){
    emptyState.style.display='block'; previewWrap.style.display='none';
    document.getElementById('footRight').textContent='';
    return;
  }
  emptyState.style.display='none'; previewWrap.style.display='block';

  const f = state.files[state.activeFile];
  const page = await f.pdfjsDoc.getPage(f.pageIndex+1);
  if(myToken!==renderToken) return;
  const baseViewport = page.getViewport({ scale:1 }); // pt units (crop box)
  const origW = baseViewport.width, origH = baseViewport.height;

  const geo = computeLayout(origW, origH);

  // render source at decent internal resolution
  const RENDER_SCALE = 2.5;
  const srcViewport = page.getViewport({ scale: RENDER_SCALE });
  const srcCanvas = document.createElement('canvas');
  srcCanvas.width = srcViewport.width; srcCanvas.height = srcViewport.height;
  const srcCtx = srcCanvas.getContext('2d');
  await page.render({ canvasContext: srcCtx, viewport: srcViewport }).promise;
  if(myToken!==renderToken) return;

  // preview scale: fit page into max box
  const mainArea = document.getElementById('mainArea');
  const maxW = Math.max(mainArea.clientWidth - 120, 200);
  const maxH = Math.max(mainArea.clientHeight - 120, 200);
  const fitScale = Math.min(maxW/geo.pW, maxH/geo.pH, 3) * state.zoom;

  const canvas = document.getElementById('previewCanvas');
  canvas.width = geo.pW*fitScale;
  canvas.height = geo.pH*fitScale;
  const ctx = canvas.getContext('2d');

  // white page bg
  ctx.fillStyle = '#F7F5EF';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // map pt->preview px, with y flip (pt origin bottom-left -> canvas top-left)
  const ptToPxX = (xPt)=> xPt*fitScale;
  const ptToPxYTop = (yPtFromBottom, heightPt)=> (geo.pH - yPtFromBottom - heightPt)*fitScale;

  // source rect in src canvas px (src canvas is top-left origin already, y from top)
  const srcPxPerPt = RENDER_SCALE;
  const sxPx = geo.cropSX*srcPxPerPt;
  const syTopPt = origH - geo.cropSY - geo.cropSH; // top-origin y of crop box
  const syPx = syTopPt*srcPxPerPt;
  const swPx = geo.cropSW*srcPxPerPt;
  const shPx = geo.cropSH*srcPxPerPt;

  const destXpx = ptToPxX(geo.destX);
  const destYpx = ptToPxYTop(geo.destY, geo.contentH);
  const destWpx = geo.contentW*fitScale;
  const destHpx = geo.contentH*fitScale;

  // clip to available (non-margin) area so content never bleeds into margin
  ctx.save();
  const availXpx = ptToPxX(geo.mLeft);
  const availYpx = ptToPxYTop(geo.mBottom, geo.availH);
  ctx.beginPath();
  ctx.rect(availXpx, availYpx, geo.availW*fitScale, geo.availH*fitScale);
  ctx.clip();
  ctx.drawImage(srcCanvas, sxPx, syPx, swPx, shPx, destXpx, destYpx, destWpx, destHpx);
  ctx.restore();

  // margin guides (dashed)
  if(geo.mTop||geo.mBottom||geo.mLeft||geo.mRight){
    ctx.save();
    ctx.strokeStyle = '#E85D4A';
    ctx.setLineDash([4,4]);
    ctx.lineWidth = 1;
    ctx.strokeRect(availXpx+0.5, availYpx+0.5, geo.availW*fitScale, geo.availH*fitScale);
    ctx.restore();
  }

  // crop marks (registration marks) at corners, just outside the page
  ctx.save();
  ctx.strokeStyle = '#E85D4A';
  ctx.lineWidth = 1;
  const L = 10, off = 5;
  const corners = [[0,0,1,1],[canvas.width,0,-1,1],[0,canvas.height,1,-1],[canvas.width,canvas.height,-1,-1]];
  corners.forEach(([x,y,dx,dy])=>{
    ctx.beginPath();
    ctx.moveTo(x+dx*off, y); ctx.lineTo(x+dx*(off+L), y);
    ctx.moveTo(x, y+dy*off); ctx.lineTo(x, y+dy*(off+L));
    ctx.stroke();
  });
  ctx.restore();

  // page border
  ctx.strokeStyle = 'rgba(15,27,45,0.15)';
  ctx.strokeRect(0.5,0.5,canvas.width-1,canvas.height-1);

  updateToolbar(f, geo);
  document.getElementById('footRight').textContent =
    `${fmt(mmToUnit(geo.pW/MM2PT,'mm'))}×${fmt(mmToUnit(geo.pH/MM2PT,'mm'))}mm · ${Math.round(fitScale/state.zoom*100)/100}x`;
}

/* ---------------- toolbar (page nav + zoom) ---------------- */
function updateToolbar(f, geo){
  let bar = document.getElementById('toolbar');
  if(!bar){
    bar = document.createElement('div');
    bar.className='toolbar'; bar.id='toolbar';
    bar.innerHTML = `
      <button id="tbPrev">‹</button>
      <span class="pagejump" id="tbPageLabel">1 / 1</span>
      <button id="tbNext">›</button>
      <button id="tbZoomOut">−</button>
      <span class="pagejump" id="tbZoomLabel">100%</span>
      <button id="tbZoomIn">+</button>
      <button id="tbFit">Fit</button>
    `;
    document.getElementById('mainArea').appendChild(bar);
    document.getElementById('tbPrev').onclick = ()=>{ f.pageIndex=Math.max(0,f.pageIndex-1); renderPreview(); };
    document.getElementById('tbNext').onclick = ()=>{ f.pageIndex=Math.min(f.numPages-1,f.pageIndex+1); renderPreview(); };
    document.getElementById('tbZoomOut').onclick = ()=>{ state.zoom=Math.max(0.3,state.zoom-0.15); renderPreview(); };
    document.getElementById('tbZoomIn').onclick = ()=>{ state.zoom=Math.min(3,state.zoom+0.15); renderPreview(); };
    document.getElementById('tbFit').onclick = ()=>{ state.zoom=1; renderPreview(); };
  }
  document.getElementById('tbPageLabel').textContent = `${f.pageIndex+1} / ${f.numPages}`;
  document.getElementById('tbZoomLabel').textContent = `${Math.round(state.zoom*100)}%`;
}

window.addEventListener('resize', ()=>{ if(state.activeFile!==-1) renderPreview(); });

/* ---------------- export ---------------- */
document.getElementById('exportBtn').addEventListener('click', exportAll);

async function exportAll(){
  const btn = document.getElementById('exportBtn');
  const progressEl = document.getElementById('exportProgress');
  btn.disabled = true;
  for(let fi=0; fi<state.files.length; fi++){
    const f = state.files[fi];
    progressEl.textContent = `Processing ${fi+1}/${state.files.length}: ${f.name}…`;
    try{
      const outBytes = await processFile(f);
      downloadBlob(outBytes, suggestName(f.name));
    }catch(err){
      console.error(err);
      progressEl.textContent = `Gagal memproses ${f.name}: ${err.message}`;
      continue;
    }
    await new Promise(r=>setTimeout(r, 250)); // avoid browser blocking multiple downloads
  }
  progressEl.textContent = `Selesai. ${state.files.length} file diproses.`;
  btn.disabled = false;
}

function suggestName(name){
  const base = name.replace(/\.pdf$/i,'');
  return `${base}-resized.pdf`;
}

async function processFile(f){
  const srcDoc = await PDFDocument.load(f.bytes.slice(0));
  const outDoc = await PDFDocument.create();
  const pageCount = srcDoc.getPageCount();
  for(let i=0;i<pageCount;i++){
    const srcPage = srcDoc.getPage(i);
    // --- ambil crop box ---
    const cropBox = srcPage.getCropBox();
    let cx, cy, cw, ch;
    if(cropBox){
      cx = cropBox.x;
      cy = cropBox.y;
      cw = cropBox.width;
      ch = cropBox.height;
    } else {
      cx = 0; cy = 0;
      cw = srcPage.getWidth();
      ch = srcPage.getHeight();
    }
    const origW = cw, origH = ch;
    const geo = computeLayout(origW, origH);
    // --- final crop dalam koordinat halaman sumber ---
    const finalLeft = cx + geo.cropSX;
    const finalBottom = cy + geo.cropSY;
    const finalRight = cx + geo.cropSX + geo.cropSW;
    const finalTop = cy + geo.cropSY + geo.cropSH;

    const embedded = await outDoc.embedPage(srcPage, {
      left: finalLeft,
      bottom: finalBottom,
      right: finalRight,
      top: finalTop
    });
    const newPage = outDoc.addPage([geo.pW, geo.pH]);
    newPage.drawPage(embedded, {
      x: geo.destX,
      y: geo.destY,
      width: geo.contentW,
      height: geo.contentH
    });
  }
  return await outDoc.save();
}

function downloadBlob(bytes, filename){
  const blob = new Blob([bytes], { type:'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

/* ---------------- init ---------------- */
refreshMarginInputsFromState();
refreshCustomSizeInputsFromState();
